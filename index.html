<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lopes Mirella - Mapa de Imóveis</title>

  <!-- 1. CSS do Leaflet (sempre antes do JS) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""/>

  <!-- Agrupa pins próximos em "bolhas" que se separam ao dar zoom -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>

  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #fff; }

    /* Grid com 3 linhas: cabeçalho com a logo, barra de filtro, conteúdo.
       "1fr" faz a última linha ocupar todo o espaço restante da tela. */
    #app {
      display: grid;
      grid-template-rows: auto auto 1fr;
      height: 100vh;
    }

    #topo {
      padding: 10px 16px;
      background: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    #botao-edicao {
      border: 1px solid #444;
      background: transparent;
      color: #fff;
      padding: 6px 14px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 13px;
    }
    #botao-edicao.ativo { background: #f4c430; border-color: #f4c430; color: #1a1a1a; font-weight: bold; }
    /* A logo tem texto escuro, então precisa de um fundo branco próprio
       pra continuar legível mesmo com o cabeçalho agora preto. */
    #logo-box {
      display: inline-block;
      background: #fff;
      padding: 6px 14px;
      border-radius: 8px;
    }
    #topo img { height: 42px; display: block; }

    #filtros {
      display: flex;
      gap: 8px;
      padding: 10px 16px;
      background: #fff;
      border-bottom: 1px solid #eee;
      overflow-x: auto;
    }
    #filtros button {
      border: 1px solid #ddd;
      background: #f5f5f5;
      color: #1a1a1a;
      padding: 6px 14px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 13px;
      white-space: nowrap;
    }
    #filtros button.ativo { background: #f4c430; border-color: #f4c430; color: #1a1a1a; font-weight: bold; }

    #filtro-tipos { display: flex; gap: 8px; }

    #filtro-bairro {
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 13px;
    }


    /* Segunda linha do grid: sidebar + mapa lado a lado */
    #conteudo {
      display: grid;
      grid-template-columns: 320px 1fr;
      min-height: 0; /* permite a sidebar rolar dentro da altura fixa do grid */
    }

    #lista-imoveis {
      overflow-y: auto;
      border-right: 1px solid #ddd;
      padding: 8px;
      background: #fff;
    }
    .card-imovel {
      display: flex;
      gap: 10px;
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 6px;
    }
    .card-imovel:hover { background: #f3f4f6; }
    .card-imovel.selecionado { background: #fdf1cf; }
    .card-imovel img { width: 70px; height: 70px; object-fit: cover; border-radius: 4px; }
    .card-imovel h4 { margin: 0 0 4px; font-size: 14px; }
    .card-imovel .preco { font-size: 13px; font-weight: bold; color: #2a7a2a; margin: 0; }
    .card-imovel .endereco { font-size: 12px; color: #666; margin: 2px 0 0; }

    #map { height: 100%; }

    .tooltip-coordenadas {
      font-size: 12px;
      line-height: 1.4;
      background: #1a1a1a;
      color: #fff;
      border: none;
    }
    .tooltip-coordenadas::before { border-top-color: #1a1a1a; }

    .popup-imovel { width: 220px; }
    .popup-imovel img { width: 100%; border-radius: 4px; margin-bottom: 6px; }
    .popup-imovel h3 { margin: 0 0 4px; font-size: 15px; }
    .popup-imovel .preco { font-weight: bold; color: #2a7a2a; margin: 2px 0; }
    .popup-imovel .endereco,
    .popup-imovel .atualizacoes,
    .popup-imovel .incorporador { font-size: 12px; color: #444; margin: 2px 0; }
    .popup-imovel a { display: inline-block; margin-top: 6px; font-size: 13px; }
  </style>
</head>
<body>

  <div id="app">
    <header id="topo">
      <div id="logo-box">
        <img src="logo.png" alt="Lopes Mirella">
      </div>
      <button id="botao-edicao">🔒 Editar posições</button>
    </header>

    <div id="filtros"></div>

    <div id="conteudo">
      <div id="lista-imoveis"></div>
      <div id="map"></div>
    </div>
  </div>

  <!-- 2. JS do Leaflet (depois do CSS) -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <script src="app.js"></script>
</body>
</html>
